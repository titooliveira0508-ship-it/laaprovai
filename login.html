<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — AprovAí</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6C4CF1',
                        'primary-dark': '#5A3EE0',
                        background: '#F7F6FB',
                        surface: '#FFFFFF',
                        border: '#EAE7F2',
                        'text-primary': '#17132B',
                        'text-secondary': '#6E6A80',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F7F6FB; color: #17132B; }
        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-primary selection:text-white">

    <div class="max-w-md w-full bg-white border border-[#E9E6F2] shadow-[0_1px_2px_rgba(23,19,43,0.05)] rounded-2xl p-8 space-y-6">

        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-primary text-white rounded-2xl flex items-center justify-center font-extrabold text-2xl mx-auto shadow-none">✓</div>
            <h1 class="text-2xl font-extrabold tracking-tight">AprovAí <span class="text-primary text-xs bg-soft px-2.5 py-1 rounded-full uppercase">PRO</span></h1>
            <p class="text-xs text-secondary">Acesse o painel de controle da sua loja</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-secondary uppercase mb-1.5">Senha de Acesso</label>
                <input type="password" id="loginPassword" required placeholder="Digite sua senha (ex: 1234)" class="w-full px-4 py-3.5 rounded-[14px] bg-[#F7F6FB] border border-[#E9E6F2] focus:bg-white focus:ring-2 focus:ring-primary focus:outline-hidden text-sm transition">
            </div>

            <button type="submit" class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-3.5 px-6 rounded-[14px] shadow-none transition-all text-sm">
                Entrar no Painel
            </button>
        </form>

        <div class="pt-2">
            <a href="login.html?demo=1" class="block w-full bg-white border-2 border-primary text-primary font-bold py-3.5 px-6 rounded-[14px] hover:bg-soft transition text-center text-sm">Ver demonstração</a>
            <p class="text-[11px] text-secondary text-center mt-2">Teste grátis, sem cadastro — veja o painel com pedidos de exemplo.</p>
        </div>

        <div class="text-center pt-2">
            <p class="text-[11px] text-[#A5A1B3]">Protegido por criptografia local • AprovAí SaaS</p>
            <p class="text-[11px] text-secondary mt-2">Esqueceu a senha? Fale com o suporte no WhatsApp <a class="text-primary font-bold" href="https://wa.me/5521998071729">(21) 99807-1729</a></p>
        </div>

    </div>

    <script>

        // --- Demonstração (sem senha, sem alterar lojas reais) ---
        var DEMO_STORE_ID = 'st_demo';
        function demoImg(label, bg, fg) {
            var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="' + bg + '"/><text x="200" y="190" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="' + fg + '" text-anchor="middle">' + label + '</text><text x="200" y="230" font-family="Arial,sans-serif" font-size="18" fill="' + fg + '" text-anchor="middle">AprovAí — demonstração</text></svg>';
            return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
        }
        function seedDemoOrders() {
            var orders = JSON.parse(localStorage.getItem('aprovai_orders')) || [];
            var demo = [
                { id: 'demo_1', storeId: DEMO_STORE_ID, clientName: 'Camila Souza', clientPhone: '(21) 99999-1111', deliveryDate: '2026-11-14', productTitle: 'Topo de Bolo — 10 anos', notes: 'Nome: Gabriel, Idade: 10.', refImageUrl: demoImg('Referência', '#FEF3C7', '#92400E'), imageUrl: demoImg('Arte pronta', '#EDE9FE', '#5A3EE0'), status: 'pending', createdAt: '2026-11-07T10:00:00.000Z' },
                { id: 'demo_2', storeId: DEMO_STORE_ID, clientName: 'Rafael Lima', clientPhone: '(21) 99999-2222', deliveryDate: '2026-11-12', productTitle: 'Camiseta personalizada', notes: 'Tamanho G, estampa frente e verso.', refImageUrl: demoImg('Referência', '#FEF3C7', '#92400E'), imageUrl: demoImg('Arte pronta', '#DCFCE7', '#166534'), status: 'approved', createdAt: '2026-11-06T10:00:00.000Z' },
                { id: 'demo_3', storeId: DEMO_STORE_ID, clientName: 'Juliana Prado', clientPhone: '(21) 99999-3333', deliveryDate: '2026-11-13', productTitle: 'Caneca com foto', notes: 'Foto do casal, caneca branca.', refImageUrl: demoImg('Referência', '#FEF3C7', '#92400E'), imageUrl: demoImg('Arte pronta', '#FFE4E6', '#9F1239'), status: 'changes', feedback: 'Trocar a cor do nome para dourado.', createdAt: '2026-11-05T10:00:00.000Z' }
            ];
            demo.forEach(function (d) { if (!orders.some(function (o) { return o.id === d.id; })) orders.push(d); });
            localStorage.setItem('aprovai_orders', JSON.stringify(orders));
        }
        function enterDemo() {
            seedDemoOrders();
            localStorage.setItem('aprovai_demo', 'true');
            localStorage.setItem('aprovai_logged', 'true');
            localStorage.setItem('aprovai_current_store_id', DEMO_STORE_ID);
            localStorage.setItem('aprovai_current_store_name', 'Loja Demonstração');
        }
        function isDemo() { return localStorage.getItem('aprovai_demo') === 'true'; }
        function exitDemo() {
            var orders = JSON.parse(localStorage.getItem('aprovai_orders')) || [];
            orders = orders.filter(function (o) { return o.storeId !== DEMO_STORE_ID; });
            localStorage.setItem('aprovai_orders', JSON.stringify(orders));
            localStorage.removeItem('aprovai_demo');
            localStorage.removeItem('aprovai_logged');
            localStorage.removeItem('aprovai_current_store_id');
            localStorage.removeItem('aprovai_current_store_name');
            window.location.href = 'login.html';
        }

        // Entrada da demonstração: ?demo=1 entra direto, sem senha, sem tocar nas lojas reais.
        if (new URLSearchParams(window.location.search).get('demo') === '1') {
            enterDemo();
            window.location.href = 'index.html?demo=1';
        }
        // Limpa sessão anterior ao abrir a tela de login para obrigar a digitar a senha
        localStorage.removeItem('aprovai_demo');
        localStorage.removeItem('aprovai_logged');
        localStorage.removeItem('aprovai_current_store_id');
        localStorage.removeItem('aprovai_current_store_name');

        function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('loginPassword').value.trim();

            // Carrega as lojas atualizadas do localStorage
            const stores = JSON.parse(localStorage.getItem('aprovai_stores')) || [
                { id: 'st_1', name: 'Felícia Personalizados', plan: '29.90', pass: 'felicia123', status: 'active' }
            ];

            // Procura uma loja com essa senha
            const store = stores.find(s => s.pass === pass);

            if (store) {
                if (store.status === 'blocked') {
                    alert('❌ Loja bloqueada! Entre em contato com o administrador.');
                    return;
                }

                // Salva quem está logado e o ID da loja
                localStorage.setItem('aprovai_logged', 'true');
                localStorage.setItem('aprovai_current_store_id', store.id);
                localStorage.setItem('aprovai_current_store_name', store.name);

                alert('✨ Bem-vindo ao AprovAí, ' + store.name + '!');
                window.location.href = 'index.html';
            } else {
                alert('❌ Senha incorreta! Verifique a senha cadastrada no Painel Mestre.');
            }
        }
    </script>
</body>
</html>
