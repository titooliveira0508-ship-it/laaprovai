<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprovação de Arte — AprovAí</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6C4CF1',
                        'primary-dark': '#5A3EE0',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#F7F6FB] text-[#17132B] min-h-screen flex flex-col justify-between p-4 md:p-8">

    <header class="max-w-md mx-auto w-full text-center py-6">
        <div class="inline-flex items-center space-x-2 bg-soft border border-[#E9E6F2] text-primary text-[10px] font-bold px-4 py-1.5 rounded-full">
            <span>Felícia Personalizados</span>
        </div>
        <h1 class="text-2xl font-extrabold mt-3 tracking-tight">Confira sua Arte</h1>
    </header>

    <main class="max-w-md mx-auto w-full bg-white border border-[#E9E6F2] shadow-[0_1px_2px_rgba(23,19,43,0.05)] rounded-2xl p-6 my-2 space-y-6">

        <div id="loadingView" class="text-center py-16">
            <div class="w-10 h-10 border-4 border-primary border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
            <p class="text-xs font-semibold text-secondary">Carregando detalhes...</p>
        </div>

        <div id="orderContentView" class="hidden space-y-5">
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1.5">
                    <span class="text-[10px] font-bold text-[#A5A1B3] uppercase tracking-wider block text-center">Referência</span>
                    <div class="rounded-2xl overflow-hidden border border-[#E9E6F2] aspect-square flex items-center justify-center">
                        <img id="refImage" src="" alt="Referência" class="w-full h-full object-cover">
                    </div>
                </div>
                <div class="space-y-1.5">
                    <span class="text-[10px] font-bold text-[#A5A1B3] uppercase tracking-wider block text-center">Sua arte</span>
                    <div class="rounded-2xl overflow-hidden border border-[#E9E6F2] aspect-square flex items-center justify-center">
                        <img id="artImage" src="" alt="Arte Pronta" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>

            <div class="space-y-3.5 bg-soft p-5 rounded-2xl border border-[#E9E6F2]">
                <div>
                    <span class="text-[10px] font-bold text-[#A5A1B3] uppercase tracking-wider block">Produto</span>
                    <h2 id="artTitle" class="font-extrabold text-lg mt-0.5">--</h2>
                </div>
                <div class="grid grid-cols-2 gap-3 pt-3 border-t border-[#E9E6F2]">
                    <div>
                        <span class="text-[10px] font-bold text-[#A5A1B3] uppercase block">Cliente</span>
                        <span id="clientName" class="font-bold text-sm text-[#17132B]">--</span>
                    </div>
                    <div>
                        <span class="text-[10px] font-bold text-[#A5A1B3] uppercase block">Entrega</span>
                        <span id="deliveryDate" class="font-bold text-sm text-green-700">--</span>
                    </div>
                </div>
            </div>

            <div id="statusBanner" class="hidden p-4 rounded-[14px] text-center font-bold text-sm"></div>

            <div id="actionButtons" class="space-y-3 pt-1">
                <button onclick="approveArt()" class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-3.5 px-6 rounded-[14px] shadow-none transition-all flex items-center justify-center space-x-2">
                    <span>Aprovar arte</span>
                </button>
                <button onclick="toggleChangesForm()" class="w-full bg-white border border-[#E9E6F2] text-secondary font-semibold py-3.5 px-6 rounded-[14px] hover:bg-[#F7F6FB] transition">
                    Solicitar ajuste
                </button>
            </div>

            <div id="changesForm" class="hidden space-y-3 pt-3 border-t border-[#E9E6F2]">
                <label class="block text-xs font-bold text-secondary uppercase tracking-wider">O que deseja alterar?</label>
                <textarea id="feedbackText" rows="3" placeholder="Ex: Mudar a cor..." class="w-full p-4 rounded-[14px] bg-[#F7F6FB] border border-[#E9E6F2] text-sm focus:ring-2 focus:ring-primary focus:outline-hidden"></textarea>
                <button onclick="submitChanges()" class="w-full bg-amber-600 text-white font-bold py-3.5 rounded-[14px] hover:bg-amber-700 transition">
                    Enviar Ajuste
                </button>
            </div>
        </div>
    </main>

    <footer class="text-center text-xs text-[#A5A1B3] py-4">
        Powered by <span class="text-primary font-extrabold">AprovAí</span>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');
        let orders = JSON.parse(localStorage.getItem('aprovai_orders')) || [];
        let currentOrder = orders.find(o => o.id === orderId);

        if (!currentOrder) {
            document.getElementById('loadingView').classList.add('hidden');
            document.getElementById('orderContentView').classList.add('hidden');
            alert('Pedido não encontrado. Verifique o link enviado pela loja.');
        } else {
            document.getElementById('loadingView').classList.add('hidden');
            document.getElementById('orderContentView').classList.remove('hidden');
            document.getElementById('refImage').src = currentOrder.refImageUrl || currentOrder.imageUrl;
            document.getElementById('artImage').src = currentOrder.imageUrl;
            document.getElementById('artTitle').innerText = currentOrder.productTitle;
            document.getElementById('clientName').innerText = currentOrder.clientName;
            document.getElementById('deliveryDate').innerText = currentOrder.deliveryDate.split('-').reverse().join('/');
            const artNotesEl = document.getElementById('artNotes'); if (artNotesEl) artNotesEl.innerText = currentOrder.notes || 'Nenhuma observação informada.';
            updateViewByStatus();
        }

        function updateViewByStatus() {
            const banner = document.getElementById('statusBanner');
            const actions = document.getElementById('actionButtons');
            if (currentOrder.status === 'approved') {
                banner.className = 'p-4 rounded-[14px] text-center font-bold text-sm bg-green-50 text-green-700 border border-green-100';
                banner.innerHTML = '✓ Arte Aprovada!';
                banner.classList.remove('hidden');
                actions.classList.add('hidden');
            } else if (currentOrder.status === 'changes') {
                banner.className = 'p-4 rounded-[14px] text-center font-bold text-sm bg-rose-50 text-rose-700 border border-rose-100';
                banner.innerHTML = `⚠️ Ajuste solicitado: "${currentOrder.feedback}"`;
                banner.classList.remove('hidden');
            }
        }

        function approveArt() {
            if(confirm('Aprovar arte?')) {
                currentOrder.status = 'approved';
                saveAndUpdate();
                location.reload();
            }
        }

        function toggleChangesForm() { document.getElementById('changesForm').classList.toggle('hidden'); }

        function submitChanges() {
            const text = document.getElementById('feedbackText').value.trim();
            if(!text) return alert('Escreva o ajuste!');
            currentOrder.status = 'changes';
            currentOrder.feedback = text;
            saveAndUpdate();
            location.reload();
        }

        function saveAndUpdate() {
            const index = orders.findIndex(o => o.id === orderId);
            orders[index] = currentOrder;
            localStorage.setItem('aprovai_orders', JSON.stringify(orders));
        }
    </script>
</body>
</html>
